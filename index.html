<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jericho Isaac Magallanes — Apps</title>
<meta name="description" content="Mobile apps built for Android and iOS.">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 56px 20px;
    background: #101519;
    color: #F5F7F8;
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { width: 100%; max-width: 620px; }
  header { margin-bottom: 40px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; letter-spacing: .01em; }
  header p { margin: 0; color: rgba(245,247,248,.62); font-size: 15px; }

  /* One card per app. A new app is a copy of this block with its own accent. */
  .app {
    display: block;
    text-decoration: none;
    color: inherit;
    background: #20282E;
    border: 1px solid rgba(245,247,248,.08);
    border-radius: 14px;
    padding: 22px 24px 24px;
    margin-bottom: 16px;
    transition: border-color .15s ease, transform .15s ease;
  }
  .app:hover, .app:focus-visible {
    border-color: rgba(245,247,248,.22);
    transform: translateY(-1px);
  }
  .app .accent { width: 64px; height: 5px; border-radius: 3px; margin-bottom: 18px; }
  .app img { height: 30px; width: auto; display: block; margin-bottom: 12px; }
  .app p { margin: 0; color: rgba(245,247,248,.78); font-size: 15px; }
  .app .meta { margin-top: 14px; font-size: 13px; color: rgba(245,247,248,.5); }

  footer { margin-top: 36px; font-size: 14px; color: rgba(245,247,248,.5); }
  a.plain { color: rgba(245,247,248,.72); }
  a { color: #E8963A; text-decoration: none; }
  a:hover, a:focus { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Jericho Isaac Magallanes</h1>
    <p>Mobile apps for Android and iOS.</p>
  </header>

  <a class="app" href="Trainr/">
    <div class="accent" style="background:#E8963A"></div>
    <img src="wordmark.png" alt="Trainr">
    <p>
      A workout planner that builds your week on your phone, from your goals,
      your equipment and the days you can train.
    </p>
    <div class="meta">Coming soon to the App Store and Google Play</div>
  </a>

  <footer>
    <a class="plain" href="https://github.com/jerichomagallanes">GitHub</a>
  </footer>
</main>
</body>
</html>
